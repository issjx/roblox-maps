name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint · StyLua format · Selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
        with: { cache: "true" }
      - name: Format (StyLua)
        run: stylua --check src maps tests scripts tools
      - name: Lint (Selene)
        run: selene src maps tests scripts tools

  test:
    name: Tests · shared code (Lune)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
        with: { cache: "true" }
      - run: lune run tests/run

  maps:
    name: Maps · validate + build every place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
        with: { cache: "true" }
      - name: Maps built by code (build.luau) match their committed Map.rbxmx
        run: lune run scripts/build-maps --check
      - name: Validate maps (structure, no hidden scripts, spawns, checkpoints, fair jumps, budgets)
        run: lune run scripts/validate-maps
      - name: Build every map with Rojo
        run: bash scripts/build.sh
      - name: Upload built places (download from the run page to playtest a PR)
        uses: actions/upload-artifact@v4
        with:
          name: places
          path: build/*.rbxl
          retention-days: 7

  # The ONLY check the branch rule on main requires. It depends on every job above, so adding or
  # renaming a job never needs a settings change (same pattern as isnad).
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, maps]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
